name: Python Code Review Agent

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest

      - name: Run AI Code Review Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python ai_agent.py

      - name: Check for code changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create agent branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH_NAME="ai-code-review/${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Commit corrected code
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "AI Code Review Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "*.py"

          git commit -m "Apply AI code review fixes"

      - name: Push agent branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin "$BRANCH_NAME"

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "AI Code Review Fixes" \
            --body "## AI Code Review

          The AI Code Review Agent detected basic Python code-quality issues and applied safe fixes.

          ### Checks performed
          - Unused imports
          - Unused variables
          - Missing function docstrings
          - Poor variable names
          - Simple PEP8 issues
          - Missing blank lines
          - Basic readability improvements

          ### Validation
          Python tests passed before the review workflow completed.
          "
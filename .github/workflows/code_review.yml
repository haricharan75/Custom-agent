name: Python AI Code Review

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  code-review:
    name: AI Code Review
    runs-on: ubuntu-latest

    steps:
      # 1. Get the repository code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Make sure the original code passes tests
      - name: Run tests before AI review
        run: |
          python -m pytest

      # 5. Run the Claude AI code review agent
      - name: Run AI Code Review Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python ai_agent.py > review_output.md

      # 6. Test the code after Claude's changes
      - name: Run tests after AI fixes
        run: |
          python -m pytest

      # 7. Check whether Claude changed anything
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No code changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Code changes detected."
          fi

      # 8. Create a new branch for the AI fixes
      - name: Create AI review branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH_NAME="ai-code-review-${GITHUB_RUN_ID}"

          git checkout -b "$BRANCH_NAME"

          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      # 9. Commit the AI-generated fixes
      - name: Commit AI fixes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "AI Code Review Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- '*.py'

          git commit -m "Apply AI code review fixes"

      # 10. Push the AI branch to GitHub
      - name: Push AI review branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin "$BRANCH_NAME"

      # 11. Create the Pull Request
      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "AI Code Review Fixes" \
            --body-file review_output.md